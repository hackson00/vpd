<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보성하루 스마트팜 VPD 실시간 모니터링 (Optimized)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-slow { animation: pulse-slow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-7xl mx-auto">
        <!-- 헤더 -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-extrabold text-emerald-400 flex items-center gap-2">
                    <span>🌱</span> 보성하루 스마트팜 VPD 실시간 대시보드
                </h1>
                <p class="text-sm text-slate-400 mt-1">구글 스프레드시트 연동 · 고속 로딩 최적화 · 1분 자동 갱신</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="sync-status" class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1.5 rounded-full flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 동기화 대기 중
                </span>
                <button id="refresh-btn" onclick="fetchSheetData()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg border border-slate-700 transition-colors flex items-center gap-1.5">
                    🔄 새로고침
                </button>
            </div>
        </header>

        <!-- 구역별 컨테이너 (육묘장 / 1동 / 2동) -->
        <div class="space-y-8">
            <!-- 육묘장 구역 -->
            <section>
                <h2 class="text-xl font-bold text-amber-400 mb-4 flex items-center gap-2">
                    <span>🏠</span> 육묘장 구역
                </h2>
                <div id="grid-nursery" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 text-slate-500 text-center col-span-full">데이터 불러오는 중...</div>
                </div>
            </section>

            <!-- 1동 구역 -->
            <section>
                <h2 class="text-xl font-bold text-sky-400 mb-4 flex items-center gap-2">
                    <span>🏡</span> 1동 구역
                </h2>
                <div id="grid-dong1" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 text-slate-500 text-center col-span-full">데이터 불러오는 중...</div>
                </div>
            </section>

            <!-- 2동 구역 -->
            <section>
                <h2 class="text-xl font-bold text-indigo-400 mb-4 flex items-center gap-2">
                    <span>🏡</span> 2동 구역
                </h2>
                <div id="grid-dong2" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 text-slate-500 text-center col-span-full">데이터 불러오는 중...</div>
                </div>
            </section>
        </div>
    </div>

    <script>
        const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1TAeZh6qbw7BJSM1kYUcUG-B57I4_ccjvc4-M5afTgjU/export?format=csv&gid=0';

        async function fetchSheetData() {
            const statusEl = document.getElementById('sync-status');
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span> 동기화 중...`;

            try {
                // 네트워크 지연 방지를 위한 8초 타임아웃 컨트롤러 추가
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);

                const response = await fetch(SPREADSHEET_CSV_URL, { 
                    signal: controller.signal,
                    cache: 'no-cache' // 항상 최신 데이터를 빠르게 가져오도록 캐시 우회
                });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error('네트워크 응답 오류');
                const csvText = await response.text();
                parseAndRender(csvText);
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> 동기화 지연/실패`;
            }
        }

        function parseAndRender(csvText) {
            // 빠른 줄바꿈 및 파싱 처리
            const lines = csvText.split('\n');
            if (lines.length < 2) return;

            let nurseryHtml = '';
            let dong1Html = '';
            let dong2Html = '';

            // 반복문 내부 DOM 조작을 줄여 렌더링 속도 대폭 향상 (DocumentFragment 방식 응용)
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                // 간단하고 빠른 CSV 컴마 파싱 (정규식 부하 감소)
                const cols = line.split(',').map(val => val.replace(/^"|"$/g, '').trim());
                if (cols.length < 8 || !cols[0]) continue;

                const [zone, time, temp, hum, vpd, status, water, interval] = cols;

                let badgeClass = 'bg-slate-800 text-slate-300 border-slate-700';
                let cardBorderClass = 'border-slate-800 hover:border-slate-700';
                
                if (status.includes('위험') || status.includes('기공')) {
                    badgeClass = 'bg-red-500/20 text-red-400 border-red-500/30 font-semibold';
                    cardBorderClass = 'border-red-500/50 bg-red-950/10 shadow-lg shadow-red-950/20';
                } else if (status.includes('과습')) {
                    badgeClass = 'bg-blue-500/20 text-blue-400 border-blue-500/30 font-semibold';
                    cardBorderClass = 'border-blue-500/50 bg-blue-950/10 shadow-lg shadow-blue-950/20';
                } else if (status.includes('보통') || status.includes('야간')) {
                    badgeClass = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
                    cardBorderClass = 'border-slate-800/80 bg-slate-900/60';
                }

                const cardHtml = `
                    <div class="bg-slate-900/80 backdrop-blur border ${cardBorderClass} rounded-2xl p-5 transition-all duration-300 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <h3 class="font-bold text-slate-100 text-lg">${zone}</h3>
                                <span class="px-2.5 py-1 rounded-full text-xs border ${badgeClass}">${status}</span>
                            </div>
                            <div class="grid grid-cols-3 gap-2 my-4 bg-slate-950/40 p-3 rounded-xl border border-slate-800/60 text-center">
                                <div>
                                    <div class="text-xs text-slate-400 mb-1">온도</div>
                                    <div class="font-mono font-semibold text-slate-200">${temp}</div>
                                </div>
                                <div>
                                    <div class="text-xs text-slate-400 mb-1">습도</div>
                                    <div class="font-mono font-semibold text-slate-200">${hum}</div>
                                </div>
                                <div>
                                    <div class="text-xs text-slate-400 mb-1">VPD</div>
                                    <div class="font-mono font-bold text-amber-300">${vpd}</div>
                                </div>
                            </div>
                        </div>
                        <div class="pt-3 border-t border-slate-800/60 flex justify-between items-center text-xs text-slate-400">
                            <div>관수량: <span class="font-mono font-medium text-slate-200">${water}</span></div>
                            <div>인터벌: <span class="font-mono font-medium text-slate-200">${interval}</span></div>
                        </div>
                        <div class="text-[10px] text-slate-500 text-right mt-2">조회: ${time}</div>
                    </div>
                `;

                if (zone.includes('육묘장')) {
                    nurseryHtml += cardHtml;
                } else if (zone.includes('1동')) {
                    dong1Html += cardHtml;
                } else if (zone.includes('2동')) {
                    dong2Html += cardHtml;
                }
            }

            // DOM 반영을 한 번에 처리하여 렌더링 속도 최적화
            document.getElementById('grid-nursery').innerHTML = nurseryHtml || '<div class="text-slate-500 text-center col-span-full">데이터 없음</div>';
            document.getElementById('grid-dong1').innerHTML = dong1Html || '<div class="text-slate-500 text-center col-span-full">데이터 없음</div>';
            document.getElementById('grid-dong2').innerHTML = dong2Html || '<div class="text-slate-500 text-center col-span-full">데이터 없음</div>';

            document.getElementById('sync-status').innerHTML = `
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span> 
                동기화 완료 (${new Date().toLocaleTimeString()})
            `;
        }

        // 초기 실행 및 60초 주기 갱신
        fetchSheetData();
        setInterval(fetchSheetData, 60000);
    </script>
</body>
</html>
