<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보성하루 딸기 스마트팜 VPD 실시간 모니터링</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-6 flex flex-col justify-between">

    <div class="max-w-[1500px] mx-auto w-full space-y-6">
        <!-- 상단 헤더 -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-900 px-6 py-4 rounded-2xl shadow-lg border border-slate-800">
            <div>
                <div class="flex items-center space-x-2">
                    <span class="bg-emerald-500/20 text-emerald-400 text-xs font-semibold px-3 py-0.5 rounded-full uppercase tracking-wider">Boseong Haru Smart Farm</span>
                    <span id="update-time" class="text-slate-400 text-xs">최종 갱신: 10-13 17:25</span>
                </div>
                <h1 class="text-2xl font-bold mt-1 text-white">🍓 보성하루 딸기 스마트팜 VPD 모니터링</h1>
            </div>
            <div class="mt-4 md:mt-0 flex items-center space-x-4">
                <!-- 요약 현황 뱃지 -->
                <div class="flex items-center space-x-3 text-xs bg-slate-950 px-4 py-2 rounded-xl border border-slate-800">
                    <span class="text-slate-400">전체 <strong class="text-white">12개소</strong></span>
                    <span class="text-slate-700">|</span>
                    <span class="text-emerald-400 font-medium">최적 10</span>
                    <span class="text-slate-700">|</span>
                    <span class="text-sky-400 font-medium">보통(야간) 1</span>
                    <span class="text-slate-700">|</span>
                    <span class="text-rose-400 font-medium">위험 1</span>
                </div>
                <button onclick="renderDashboard()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-xs font-medium transition shadow-md">
                    새로고침 🔄
                </button>
            </div>
        </header>

        <!-- 구역별 그리드 컨테이너 -->
        <main id="sections-container" class="space-y-6">
            <!-- 자바스크립트로 12개 지점이 정갈하게 출력됩니다 -->
        </main>
    </div>

    <!-- 하단 푸터 -->
    <footer class="text-center text-slate-500 text-xs mt-6">
        보성하루(Boseong Haru) 딸기 스마트팜 관수 자동제어 시스템 &copy; 2026
    </footer>

    <script>
        // 육묘장스마트팜 항목이 제외된 데이터셋 (총 12개 지점)
        const farmData = {
            "🌱 육묘장 구역 (4개 지점)": [
                { zone: "육묘장외부", temp: 22.0, hum: 63, vpd: 1.0, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" },
                { zone: "육묘장중간", temp: 23.3, hum: 70, vpd: 0.9, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" },
                { zone: "육묘장왼쪽", temp: 22.8, hum: 71, vpd: 0.8, status: "보통 🌙 (야간)", statusType: "wet", water: "500 ml", interval: "120분" },
                { zone: "육묘장오른쪽", temp: 28.6, hum: 55, vpd: 1.8, status: "위험 🚨 (기공닫힘)", statusType: "danger", water: "600 ml", interval: "75분" }
            ],
            "🏠 1동 (4개 지점)": [
                { zone: "1동 외부", temp: 21.9, hum: 64, vpd: 1.0, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" },
                { zone: "1동 왼쪽", temp: 23.6, hum: 65, vpd: 1.0, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" },
                { zone: "1동 중앙", temp: 24.1, hum: 63, vpd: 1.1, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" },
                { zone: "1동 오른쪽", temp: 23.3, hum: 65, vpd: 1.0, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" }
            ],
            "🏡 2동 (4개 지점)": [
                { zone: "2동 외부", temp: 21.6, hum: 66, vpd: 0.9, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" },
                { zone: "2동 왼쪽", temp: 23.6, hum: 60, vpd: 1.2, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" },
                { zone: "2동 중앙", temp: 23.0, hum: 64, vpd: 1.0, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" },
                { zone: "2동 오른쪽", temp: 23.0, hum: 61, vpd: 1.1, status: "최적 ☀️", statusType: "normal", water: "500 ml", interval: "120분" }
            ]
        };

        function renderDashboard() {
            const container = document.getElementById('sections-container');
            container.innerHTML = '';

            for (const [sectionTitle, items] of Object.entries(farmData)) {
                const sectionEl = document.createElement('section');
                sectionEl.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg';

                sectionEl.innerHTML = `
                    <div class="flex items-center justify-between mb-4 pb-2.5 border-b border-slate-800">
                        <h2 class="text-base font-bold text-white tracking-wide">${sectionTitle}</h2>
                        <span class="text-xs text-slate-400">4개 지점 정상 작동</span>
                    </div>
                    <!-- 균등한 4열 레이아웃으로 가독성 극대화 -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        ${items.map(item => createCardHtml(item)).join('')}
                    </div>
                `;
                container.appendChild(sectionEl);
            }
        }

        function createCardHtml(item) {
            let cardStyle = "bg-slate-950/70 border-slate-800 hover:border-slate-700";
            let badgeStyle = "bg-emerald-500/10 text-emerald-400 border-emerald-500/30";
            let vpdColor = "text-emerald-400";

            if (item.statusType === 'danger') {
                cardStyle = "bg-rose-950/30 border-rose-500/60 ring-1 ring-rose-500/30 shadow-rose-950/50 shadow-md";
                badgeStyle = "bg-rose-500/20 text-rose-400 border-rose-500/40 animate-pulse";
                vpdColor = "text-rose-400 font-bold";
            } else if (item.statusType === 'wet') {
                cardStyle = "bg-sky-950/30 border-sky-500/50";
                badgeStyle = "bg-sky-500/20 text-sky-300 border-sky-500/30";
                vpdColor = "text-sky-400 font-bold";
            }

            return `
                <div class="rounded-xl p-4 border transition flex flex-col justify-between ${cardStyle}">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-white text-sm">${item.zone}</h3>
                            <span class="text-[11px] px-2 py-0.5 rounded-md border font-medium ${badgeStyle}">
                                ${item.status}
                            </span>
                        </div>
                        <div class="grid grid-cols-3 gap-1.5 text-center bg-slate-900/90 p-2.5 rounded-lg border border-slate-800/80 my-3">
                            <div>
                                <span class="text-[10px] text-slate-400 block mb-0.5">온도</span>
                                <span class="text-xs font-semibold text-slate-200">${item.temp}°C</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-400 block mb-0.5">습도</span>
                                <span class="text-xs font-semibold text-slate-200">${item.hum}%</span>
                            </div>
                            <div>
                                <span class="text-[10px] text-slate-400 block mb-0.5">VPD</span>
                                <span class="text-xs font-bold ${vpdColor}">${item.vpd} <span class="text-[9px] font-normal">kPa</span></span>
                            </div>
                        </div>
                    </div>
                    <div class="pt-2 border-t border-slate-800/80 flex justify-between items-center text-xs text-slate-400">
                        <span>💦 관수 설정</span>
                        <span class="font-medium text-slate-200">${item.water} <span class="text-[10px] text-slate-400">(${item.interval})</span></span>
                    </div>
                </div>
            `;
        }

        renderDashboard();
    </script>
</body>
</html>
