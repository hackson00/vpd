<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>보성하루 육묘장 & 스마트팜 VPD 실시간 모니터링</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <meta http-equiv="refresh" content="60"> <!-- 60초마다 자동 새로고침 -->
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        <!-- 헤더 -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-emerald-400">🌱 보성하루 스마트팜 VPD 실시간 현황</h1>
                <p class="text-sm text-slate-400 mt-1">구글 스프레드시트 연동 대시보드 (60초 주기 자동 갱신)</p>
            </div>
            <div class="mt-4 md:mt-0 text-right">
                <span id="last-update" class="text-xs bg-slate-800 px-3 py-1.5 rounded-full text-slate-300">데이터 로딩 중...</span>
            </div>
        </header>

        <!-- 데이터 테이블 카드 -->
        <div class="bg-slate-800/50 rounded-2xl border border-slate-700/60 overflow-hidden shadow-xl backdrop-blur-md">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-700">
                            <th class="p-4 font-semibold">구역 구분</th>
                            <th class="p-4 font-semibold">조회 시간</th>
                            <th class="p-4 font-semibold">온도 (°C)</th>
                            <th class="p-4 font-semibold">습도 (%)</th>
                            <th class="p-4 font-semibold">VPD (kPa)</th>
                            <th class="p-4 font-semibold">생육 상태</th>
                            <th class="p-4 font-semibold">추천 관수량</th>
                            <th class="p-4 font-semibold">관수 인터벌</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="divide-y divide-slate-700/50 text-sm">
                        <tr>
                            <td colspan="8" class="p-8 text-center text-slate-400">데이터를 불러오는 중입니다...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 스프레드시트 CSV 내보내기 링크 (gid=0 기준)
        // 주의: 스프레드시트가 '링크가 있는 모든 사용자에게 공개(뷰어)' 상태여야 합니다.
        const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1TAeZh6qbw7BJSM1kYUcUG-B57I4_ccjvc4-M5afTgjU/export?format=csv&gid=0';

        async function fetchSheetData() {
            try {
                const response = await fetch(SPREADSHEET_CSV_URL);
                if (!response.ok) throw new Error('네트워크 응답이 올바르지 않습니다.');
                const csvText = await response.text();
                parseAndRenderCSV(csvText);
            } catch (error) {
                console.error('데이터를 불러오지 못했습니다:', error);
                document.getElementById('data-table-body').innerHTML = `
                    <tr><td colspan="8" class="p-8 text-center text-red-400">데이터를 불러오는 중 오류가 발생했습니다. 스프레드시트 공유 권한을 확인해주세요.</td></tr>
                `;
            }
        }

        function parseAndRenderCSV(csvText) {
            const rows = csvText.split('\n').map(row => {
                // CSV 파싱 (쉼표로 구분하되 따옴표 처리)
                const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                return row.split(regex).map(val => val.replace(/^"|"$/g, '').trim());
            });

            if (rows.length < 2) return;

            const headers = rows[0]; // A1:H1 헤더
            const dataRows = rows.slice(1); // 실제 데이터
            
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '';

            let latestTime = '';

            dataRows.forEach((cols, index) => {
                if (cols.length < 8 || !cols[0]) return; // 빈 행 무시

                const [zone, time, temp, hum, vpd, status, water, interval] = cols;
                if (!latestTime && time) latestTime = time;

                // 생육 상태에 따른 배지 스타일 설정
                let statusBadgeClass = 'bg-slate-700 text-slate-300';
                if (status.includes('위험') || status.includes('기공')) {
                    statusBadgeClass = 'bg-red-500/20 text-red-400 border border-red-500/30 font-semibold';
                } else if (status.includes('과습')) {
                    statusBadgeClass = 'bg-blue-500/20 text-blue-400 border border-blue-500/30 font-semibold';
                } else if (status.includes('보통') || status.includes('야간')) {
                    statusBadgeClass = 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
                }

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40 transition-colors';
                tr.innerHTML = `
                    <td class="p-4 font-medium text-slate-200">${zone}</td>
                    <td class="p-4 text-slate-400 text-xs">${time}</td>
                    <td class="p-4 font-mono">${temp}</td>
                    <td class="p-4 font-mono">${hum}</td>
                    <td class="p-4 font-mono font-bold text-amber-300">${vpd}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs inline-block ${statusBadgeClass}">${status}</span></td>
                    <td class="p-4 font-mono">${water}</td>
                    <td class="p-4 font-mono">${interval}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('last-update').innerText = `마지막 동기화: ${new Date().toLocaleTimeString()} (시트 기준: ${latestTime})`;
        }

        // 페이지 로드 시 실행 및 60초 주기 갱신
        fetchSheetData();
        setInterval(fetchSheetData, 60000);
    </script>
</body>
</html>
